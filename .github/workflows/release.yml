name: release

# Porthole is a Mavericks app that IS its own upstream, so it is versioned by DATE with no
# -mavericks suffix: a release is YYYYMMDD.N, from shipyard's self-upstream-version.sh (the date is
# the day Porthole's own code last changed). push/PR to main build + test only; a manual
# workflow_dispatch cuts + publishes a release. Build -> signed .pkg +
# Sparkle appcast -> the shared publish-release.yml (which mints the tag, checksums, notes body).
# Built on Linux; installed and tested on Mac OS X 10.9 in a VM (vm-test).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only from a tag or a dispatch, but keeps the family's one shape: most of the
# family's product repos auto-cut on a push to main, and a rule that holds only in some of them is a
# rule nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Linux, like most of the family: the pinned clang22 cross-builds every Mac binary against the 10.9
    # SDK, the llvm-* readers measure them, and shipyard's stevedore seams make the pkg. What needs a
    # Mac to RUN -- the macOS-only tests and the transport's real relay -- runs on 10.9 in vm-test.
    runs-on: ubuntu-latest
    # A hang must cost minutes, not the 6-hour default. From 2026-08-04 to 2026-09-09 every run here
    # blocked on the launcher's modal die() dialog and was killed at the 360-minute limit -- three
    # runs per push, ~18 runner-hours, producing nothing and reporting only "cancelled". The dialog
    # is fixed; this is the backstop that makes the NEXT hang cheap and legible instead of silent.
    timeout-minutes: 45
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # self-upstream-version.sh reads history and the <date>.N tags

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "PH_BUILD=$RUNNER_TEMP/mm-build/porthole-cross" >> "$GITHUB_ENV"

      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        run: |
          set -eu
          ver="$(sh "$SHIPYARD_SCRIPTS/self-upstream-version.sh")"
          pub=no
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && pub=yes
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      # The pinned clang22 (components/clang22/version), unpacked once by fetch_clang22.sh and kept.
      - name: Cache the pinned clang22
        uses: actions/cache@v6
        with:
          path: ~/.cache/mavergreen-clang22
          key: clang22-${{ runner.os }}-${{ hashFiles('components/clang22/version') }}

      # Every host-agnostic test runs here and none may skip; the macOS-only ones run in vm-test.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host

      - name: clang22's Mach-O readers, for the compat guard and the steps that read the pkg
        run: |
          set -eu
          CL="$(sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" "$PWD/components/clang22")"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; } >> "$GITHUB_ENV"

      # Compiled by the pinned clang22, as on a developer's Mac or 10.9 box -- never a runner's own
      # compiler. There is no shipyard-cmake off macOS: install@v1 points find_package at shipyard via
      # MavericksShipyard_DIR, so the runner's cmake configures. The transport can't be run here
      # (CHECK_TRANSPORT_RUN=elsewhere): vm-test runs it on 10.9 from the installed pkg.
      - name: Build Porthole.app + the Sparkle updater (x86_64 / min-10.9)
        env:
          CHECK_TRANSPORT_RUN: elsewhere
        run: |
          set -eu
          cmake -S . -B "$PH_BUILD/_build" -DPORTHOLE_BUILD_UPDATER=ON \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/MavericksClang22Toolchain.cmake" \
            -DMAVERICKS_CLANG22_PIN="$PWD/components/clang22"
          cmake --build "$PH_BUILD/_build" --target Porthole
          cmake --build "$PH_BUILD/_build" --target porthole-updater
          cmake --build "$PH_BUILD/_build" --target transport   # cross-build skalibs+s6 -> _build/engine-bin
          cmake --build "$PH_BUILD/_build" --target porthole-caller porthole-watch-exit   # -> _build/standin

      - name: Package the .pkg (Porthole.app + engine CLI + updater + LaunchAgent)
        run: |
          set -eu
          UPD_APP="$PH_BUILD/_build/porthole-updater.app" \
          PORTHOLE_TRANSPORT_DIR="$PH_BUILD/_build/engine-bin" \
          PORTHOLE_STANDIN_DIR="$PH_BUILD/_build/standin" \
            sh packaging/macos/build_pkg.sh "${{ steps.ver.outputs.ver }}" \
               "$PH_BUILD/dist/porthole-${{ steps.ver.outputs.ver }}.pkg" \
               "$PH_BUILD/_build/viewer/Porthole.app"

      # Generate the single notes file ONCE, before it has two consumers: the appcast's <description>
      # (next step) and the release body, which travels IN the artifact because publish-release.yml
      # does not check out the repo (dist/RELEASE_NOTES.md is uploaded below with the rest of dist/*).
      # Same bytes, same file, read twice -- so the Release page and Sparkle tell one story.
      - name: Generate release notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          VER="${{ steps.ver.outputs.ver }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "$VER" --version "$VER" \
            --product Porthole --min-os 10.9.5 --out "$PH_BUILD/dist/RELEASE_NOTES.md"

      - name: EdDSA-sign the .pkg + generate the Sparkle appcast
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
        run: |
          set -eu
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ steps.ver.outputs.ver }}"
          PKG="$(ls "$PH_BUILD"/dist/porthole-*.pkg | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product porthole --feed-dir "$PH_BUILD/dist" \
            --channel-title "Porthole" --version "$VER" \
            --pkg-url "$base/$(basename "$PKG")" --notes-file "$PH_BUILD/dist/RELEASE_NOTES.md" \
            --pkg "$PKG" --min-os 10.9.5
          echo "=== porthole.xml ==="; cat "$PH_BUILD/dist/porthole.xml"

      # Conformance: does the pkg we are about to publish carry the family's identity, install paths,
      # floor and version scheme (INGREDIENTS.md "Conformance deviations" excuses the rest)?
      # Gated like the signing step and run after it: the checker cross-validates appcast<->pkg.
      - name: Artifact conformance
        if: steps.ver.outputs.publish == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$PH_BUILD/dist" "${{ steps.ver.outputs.ver }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: porthole
          path: ${{ env.PH_BUILD }}/dist/*

  # On Mac OS X 10.9: install the pkg, run the transport it installed for real, and run every
  # macOS-only test (the ones the Linux build can't). bats comes from the runner's apt (Debian's
  # bats-core, unpacked, not installed; it runs on 10.9's bash 3.2); Longboat (for clang22's SDK), clang22,
  # cmake and shipyard are the family's own pkgs, for the tests that compile or configure.
  vm-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: porthole
          path: dist

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # On Linux, install@v1 installs nothing and leaves SHIPYARD_SCRIPTS in its own checkout, whose
      # components/cmake/version is the cmake its shipyard pkg requires.
      - name: Stage bats, Longboat, Container Tools, clang22, make, cmake, shipyard and the 10.9 SDK
        run: |
          set -eu
          mkdir -p deps
          fetch() { sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" "$@" deps; }
          lb="$(tr -d '[:space:]' < components/longboat/version)"
          fetch longboat "$lb" "longboat-$lb.pkg"
          ct="$(tr -d '[:space:]' < components/container-tools/version)"
          fetch container-tools "$ct" "container-tools-$ct.pkg"
          c="$(tr -d '[:space:]' < components/clang22/version)"
          fetch clang-22 "$c" "mavericks-clang-22-native-$c.pkg"
          cm="$(tr -d '[:space:]' < "$SHIPYARD_SCRIPTS/../components/cmake/version")"
          fetch cmake "$cm" "cmake-$cm.pkg"
          mk="$(tr -d '[:space:]' < components/make/version)"
          fetch make "$mk" "make-$mk.pkg"
          sv="${SHIPYARD_VERSION:?install@v1 named no shipyard release}"
          fetch shipyard "v$sv" "mavericks-shipyard-$sv.pkg"
          MAVERICKS_SDK_CACHE="$PWD/deps/mavericks-sdk" sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh" --arch x86_64
          (cd "$RUNNER_TEMP" && apt-get download bats)
          dpkg-deb -x "$RUNNER_TEMP"/bats_*.deb deps/bats
          git log -1 --format=%ct > deps/source-date-epoch   # the guest has no git
          ls dist deps

      - name: On Mac OS X 10.9, install the pkg, run its transport, and run the macOS-only tests
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          run: |
            set -eu
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            # clang22's pkg requires the 10.9 SDK that Longboat installs (its --requires sdk109).
            for p in deps/longboat-*.pkg; do sudo installer -pkg "$p" -target /; done
            sudo /usr/local/mavergreen/longboat/bin/longboat sdk install 10.9
            for p in deps/mavericks-clang-22-native-*.pkg deps/make-*.pkg deps/cmake-*.pkg deps/mavericks-shipyard-*.pkg; do
              sudo installer -pkg "$p" -target /
            done
            # Porthole's pkg requires Container Tools (--requires container-tools), as a user's Mac has it.
            for p in deps/container-tools-*.pkg; do sudo installer -pkg "$p" -target /; done
            V='${{ needs.build.outputs.ver }}'
            sudo installer -pkg "dist/porthole-$V.pkg" -target /
            sh build/check-transport.sh --run-only /Applications/Porthole.app/Contents/Resources/engine/bin

            export PATH="/usr/local/mavergreen/bin:$PATH" MAVERICKS_SDK_CACHE="$PWD/deps/mavericks-sdk"
            # The pkg seams stamp file times from the commit; with no git here, they take it from this.
            SOURCE_DATE_EPOCH="$(cat deps/source-date-epoch)"; export SOURCE_DATE_EPOCH
            # 10.9 has no Command Line Tools, so no plain clang: the tests that compile use clang22.
            export CC=/usr/local/mavergreen/clang22/bin/clang
            [ -x "$CC" ] || { echo "no clang22 at $CC"; exit 1; }
            TMPDIR="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"; export TMPDIR
            # Every macOS-only test, and none may skip: here is where it runs.
            n=0 bad=
            for t in tests/*.bats; do
              grep -q '^# platform: macOS-only' "$t" || continue
              n=$((n + 1))
              if deps/bats/usr/bin/bats "$t" > "$TMPDIR/t.log" 2>&1 && ! grep -q '^ok [0-9][0-9]* .*# skip' "$TMPDIR/t.log"; then
                echo "PASS $t"
              else
                echo "FAIL $t"; sed 's/^/    | /' "$TMPDIR/t.log"; bad=1
              fi
            done
            [ "$n" -gt 0 ] || { echo "no macOS-only test found"; exit 1; }
            [ -z "$bad" ] || exit 1
            echo "$n macOS-only test files passed on $(sw_vers -productVersion)"

  # All-or-nothing publish: the ONLY writer to Releases, gated on the build. The shared workflow
  # regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the body (failing if missing
  # or empty), and mints the tag at this commit (a dispatch-cut tag pushed by GITHUB_TOKEN triggers
  # nothing, so the publisher must mint it inline).
  # The shared BASE container image every viewer FROMs (xpra/Xvfb/runtime/menu-daemon/fonts -- NO
  # vendor software). Built on Linux and pushed to GHCR so users PULL the heavy common layer (shared
  # across all apps) instead of rebuilding it. Tagged with the release version + :latest, matching the
  # BASE_REF generate-viewer pins. First push creates the package PRIVATE -- flip it to PUBLIC once in
  # the org's package settings so users can pull without a GitHub login.
  #
  # This job is the ONLY writer to GHCR, and it runs only on a publishing run -- which is why
  # base-image.yml exists to BUILD the same image (via the same script, no push) on every PR that can
  # change it. Without that, a rotted pin stays invisible until a release dispatch goes red.
  base-image:
    needs: build
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest   # Linux, for `docker build` of the amd64 image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # build-base-image.sh runs tests/base/standin_ns_test.sh, whose launcher makes an unprivileged user
      # namespace. Ubuntu's AppArmor restricts those on this runner; the Docker VM Porthole runs on
      # (boot2docker) has no AppArmor, so the runner's policy is relaxed rather than tested.
      - name: Allow unprivileged user namespaces on the runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build + push the shared base
        run: |
          set -eu
          IMG=ghcr.io/mavergreen/porthole-base
          VER="${{ needs.build.outputs.ver }}"
          # One script assembles the context and reads the XPRA_VERSION pin, so this job and the
          # PR-time base-image.yml build byte-identical instructions.
          sh build/build-base-image.sh "$IMG:$VER" "$IMG:latest"
          docker push "$IMG:$VER"
          docker push "$IMG:latest"
          echo "pushed $IMG:$VER + :latest"
      # The release's recipes say FROM this tag, so what users need is an anonymous pull of it.
      - name: Pull it back without credentials
        run: |
          set -eu
          docker logout ghcr.io
          docker rmi "ghcr.io/mavergreen/porthole-base:${{ needs.build.outputs.ver }}"
          docker pull "ghcr.io/mavergreen/porthole-base:${{ needs.build.outputs.ver }}"

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: porthole
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # A Porthole whose base image is missing can build no app at all (20260802.5 shipped that way).
  publish:
    needs: [build, vm-test, scan, base-image]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: porthole
